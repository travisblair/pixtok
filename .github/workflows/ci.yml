name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Track go.mod exactly — a hardcoded pin drifts (reviewer finding).
          go-version-file: backend/go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test (race)
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
      # The prod-serve e2e spec boots the real Go binary with the
      # embedded frontend — build it here, AFTER npm run build has
      # populated backend/static (vite outDir), so go:embed finds the
      # fresh assets.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Build prod server binary (embeds backend/static)
        run: go build -o pixtok-server .
        working-directory: backend
      - name: Unit tests
        run: npx vitest run
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
